# Build the bootnode images on hanzoai's arc runners.
#
# bootnode lives in the separate `bootnode` GitHub org, which the arcd App isn't
# installed on yet, so its own CI has no runner. The image is ghcr.io/hanzoai/
# bootnode and hanzoai's arc pool is live, so we build it here until bootnode
# org gets the App. Dispatch with the ref to build (default the latest tag).
name: Build bootnode

on:
  workflow_dispatch:
    inputs:
      ref:
        description: bootnode/bootnode ref to build
        default: v1.0.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, amd64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: api, context: api }
          - { app: web, context: web }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bootnode/bootnode
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.app }}
        run: |
          set -euo pipefail
          BASE=ghcr.io/hanzoai/bootnode
          V="${{ inputs.ref }}"; V="${V#v}"
          docker buildx build --platform linux/amd64 --push \
            -t "$BASE:${V}-amd64-${{ matrix.app }}" \
            -t "$BASE:${{ matrix.app }}-latest" \
            -f "${{ matrix.context }}/Dockerfile" "${{ matrix.context }}"
