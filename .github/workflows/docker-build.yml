name: Docker Build & Push (Reusable)

# ─── MIGRATION NOTICE ────────────────────────────────────────────────
# This reusable workflow is now the FALLBACK build path. The canonical
# build+deploy lifecycle is owned by platform.hanzo.ai: a repo commits a
# `.platform.yml`, platform receives the GitHub webhook, schedules the
# build onto the SAME self-hosted arcd pools, and rolls the image out via
# the hanzo operator — independent of GitHub Actions billing/availability.
# (The GHA billing-freeze incident proved GHA is a single point of failure.)
#
# To migrate a repo: add `.platform.yml` at its root (schema:
# platform docs/PLATFORM_CI.md) and point its GitHub App webhook at
# https://platform.hanzo.ai/v1/github-webhook. This workflow is RETAINED
# (not deleted) as a fallback for repos that have not migrated yet and as
# the build executor that platform's `platform-build.yml` delegates to.
# ─────────────────────────────────────────────────────────────────────
#
# Reusable workflow for native multi-arch Docker builds.
# Native runners only — NO GitHub-hosted runners, period.
#
# Canonical native arcd labels (every arcd host registers with these):
#   amd64 jobs : [self-hosted, linux, amd64]   (online DOKS ARC scale-set)
#   arm64 jobs : [self-hosted, linux, arm64]   (matches spark)
#   macOS jobs : [self-hosted, macos]          (matches dbc)
#
# Inputs (runner-amd64, runner-arm64, runner-deploy) carry JSON-array
# strings and are decoded via fromJson() at the `runs-on:` site. Defaults
# target the canonical arcd labels above. Cross-org callers do NOT need
# to override — GitHub-side runner groups + arcd repo allowlist provide
# org isolation on the shared labels.
# GitHub-hosted runners are NOT a permitted fallback.
#
# ─── Registry support ────────────────────────────────────────────────
# registry=ghcr.io  (default) → GITHUB_TOKEN login for hanzoai/luxfi/zooai
# registry=us-docker.pkg.dev   → GCP SA JSON in secrets.GCP_CREDENTIAL for the GCP-registry org
#                               (org secret on that GCP org; pass secrets: inherit)
#
# ─── Multi-image repos ───────────────────────────────────────────────
# Callers with more than one image fan-out via their own matrix:
#
#   jobs:
#     docker:
#       strategy:
#         matrix:
#           include:
#             - image: ghcr.io/hanzoai/chat-api
#               dockerfile: Dockerfile.api
#             - image: ghcr.io/hanzoai/chat-web
#               dockerfile: Dockerfile.web
#       uses: hanzoai/.github/.github/workflows/docker-build.yml@main
#       with:
#         image: ${{ matrix.image }}
#         dockerfile: ${{ matrix.dockerfile }}
#       secrets: inherit
#
# ─── Pre-build steps ─────────────────────────────────────────────────
# For repos that must compile a binary before the Dockerfile COPYs it
# (e.g. hanzo/dns), pass `pre-build-command` — it runs on each arch
# runner before `docker buildx build`.
#
# Usage — simple single-image GHCR:
#
#   jobs:
#     docker:
#       uses: hanzoai/.github/.github/workflows/docker-build.yml@main
#       with:
#         image: ghcr.io/hanzoai/myservice
#       secrets: inherit

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name (e.g. ghcr.io/hanzoai/bot, us-docker.pkg.dev/<gcp-project>/<org>/<image>)"
        required: true
        type: string
      registry:
        description: "Container registry (ghcr.io or us-docker.pkg.dev)"
        default: "ghcr.io"
        type: string
      context:
        description: "Docker build context"
        default: "."
        type: string
      dockerfile:
        description: "Dockerfile path relative to context"
        default: "Dockerfile"
        type: string
      build-args:
        description: "Docker build args (multiline KEY=VALUE). Concatenated with go-experiment for Go builds."
        default: ""
        type: string
      go-experiment:
        description: "GOEXPERIMENT value for Go builds (forwarded as GO_EXPERIMENT build-arg). Default 'jsonv2' per SCALE_STANDARD.md §2 — -12% time / -23% allocs at the JSON edge. Set to '' to opt out."
        default: "jsonv2"
        type: string
      target:
        description: "Docker build target stage"
        default: ""
        type: string
      platforms:
        description: "Comma-separated platforms to build. Default amd64-only — no
          arm64 arcd runner ([self-hosted,linux,arm64] / spark) is registered, so a
          multi-arch default hangs build-arm64 forever and create-manifest (needs
          both arches) never publishes the clean :X.Y.Z tag (only :X.Y.Z-amd64
          lands). Opt into true multi-arch with 'linux/amd64,linux/arm64' ONCE an
          arm64 runner exists; then restore this default in one line."
        default: "linux/amd64"
        type: string
      push:
        description: "Push images to registry"
        default: true
        type: boolean
      pre-build-command:
        description: "Shell command to run before docker buildx build (e.g. 'go build -o dns-server ./cmd/dns')"
        default: ""
        type: string
      deploy:
        description: "Deploy after build (kubectl set image to the just-built tag)"
        default: false
        type: boolean
      deploy-deployment:
        description: "K8s deployment name"
        default: ""
        type: string
      deploy-container:
        description: "Container name within the deployment to update (defaults to deploy-deployment)"
        default: ""
        type: string
      deploy-namespace:
        description: "K8s namespace for deployment"
        default: "hanzo"
        type: string
      deploy-tag:
        description: "Explicit image tag to deploy. Defaults to {version}-amd64 on tag pushes (e.g. v1.2.3 → 1.2.3-amd64), sha-<short>-amd64 on branch pushes."
        default: ""
        type: string
      deploy-timeout:
        description: "Rollout readiness timeout"
        default: "300s"
        type: string
      tag-suffix:
        description: "Extra suffix for tags (e.g. -slim)"
        default: ""
        type: string
      cache-key:
        description: "Registry cache key prefix (defaults to image name)"
        default: ""
        type: string
      runner-amd64:
        description: "Runner labels for amd64 builds as JSON-array string. Defaults to canonical arcd labels (online DOKS ARC scale-set). Decoded via fromJson at runs-on."
        default: '["hanzo-build-linux-amd64"]'
        type: string
      runner-arm64:
        description: "Runner labels for arm64 builds as JSON-array string. Defaults to canonical arcd labels (matches spark). Decoded via fromJson at runs-on."
        default: '["self-hosted","linux","arm64"]'
        type: string
      runner-deploy:
        description: "Runner labels for deploy jobs as JSON-array string. Defaults to canonical arcd labels. Decoded via fromJson at runs-on."
        default: '["hanzo-build-linux-amd64"]'
        type: string
      sbom:
        description: "Generate a Software Bill of Materials (syft → SPDX + CycloneDX) for the pushed image, upload it as a workflow artifact, and attach it to the image in the registry (cosign). Powers OSS revenue-share attribution (deployed image → components → contributors). Non-blocking; set false to skip."
        default: true
        type: boolean

    outputs:
      amd64-digest:
        description: "amd64 image digest"
        value: ${{ jobs.build-amd64.outputs.digest }}
      arm64-digest:
        description: "arm64 image digest"
        value: ${{ jobs.build-arm64.outputs.digest }}
      manifest-tags:
        description: "Final manifest tags (JSON)"
        value: ${{ jobs.create-manifest.outputs.tags }}

    # Secrets a reusable workflow REFERENCES must be DECLARED here, or
    # GitHub rejects it at parse time with
    #   422 failed to parse workflow: error parsing called workflow
    # for every caller that doesn't pass them explicitly — which killed
    # docker-build org-wide at 0s (the `${{ secrets.GCP_CREDENTIAL }}` /
    # `${{ secrets.GH_PAT }}` references below were undeclared). Declaring
    # them `required: false` is the canonical fix: the parser is satisfied,
    # AND cross-org callers that lack the secret still pass validation (it
    # resolves to empty where absent — the GAR login step gates on
    # inputs.registry, and gh_token falls back to GITHUB_TOKEN). `secrets:
    # inherit` continues to flow the real values where the caller has them.
    secrets:
      GCP_CREDENTIAL:
        description: "GCP SA JSON for us-docker.pkg.dev pushes. Optional — only the GCP-registry org provides it; empty elsewhere."
        required: false
      GH_PAT:
        description: "GitHub PAT for private deps during build. Optional — falls back to GITHUB_TOKEN."
        required: false

# ── Build hygiene ────────────────────────────────────────────────
# docker/build-push-action@v6 uploads a build-record/summary artifact by
# default. When the org's Actions artifact-storage quota is full that upload
# fails with "CreateArtifact: Artifact storage quota has been hit" and fails
# the whole Build-and-push step — silently blocking ALL image publishing.
# The build record is non-essential telemetry; the image push is what matters.
# Disable it so a full artifact quota can never wedge releases again.
env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ── amd64 (native arcd runner — evo matches [self-hosted, linux, amd64]) ──
  build-amd64:
    if: contains(inputs.platforms, 'linux/amd64')
    runs-on: ${{ fromJson(inputs.runner-amd64) }}
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Reset Docker credential store (runner hygiene)
        # Some self-hosted runners carry a leaked Docker Desktop config
        # (credsStore=desktop / docker-credential-desktop.exe) that breaks
        # `docker login` credential storage. Reset to an empty config so the
        # GITHUB_TOKEN auth is stored inline (works on any runner).
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Pre-build command
        if: inputs.pre-build-command != ''
        working-directory: ${{ inputs.context }}
        run: ${{ inputs.pre-build-command }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Tag policy:
          #   v* git tag    → :{{version}}-amd64 AND :latest-amd64
          #   branch push   → :sha-<sha7>-amd64 (immutable, no floating)
          #   PR push       → :pr-N-amd64 (ephemeral review)
          # :latest tracks the most recent semver release (never floats off main).
          flavor: |
            latest=auto
            suffix=-amd64${{ inputs.tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          # SCALE_STANDARD.md §2: GO_EXPERIMENT=jsonv2 by default for
          # all Go builds. Dockerfiles consume via `ARG GO_EXPERIMENT` +
          # `ENV GOEXPERIMENT=${GO_EXPERIMENT}` before `go build`.
          # Non-Go Dockerfiles ignore the unused ARG.
          build-args: |
            GO_EXPERIMENT=${{ inputs.go-experiment }}
            ${{ inputs.build-args }}
          target: ${{ inputs.target || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.image }}-amd64
          cache-to: type=gha,scope=${{ inputs.image }}-amd64,mode=max
          provenance: false
          push: ${{ inputs.push }}
          # Private cross-repo deps (hanzoai/*, luxfi/*): expose the org PAT as
          # BuildKit secrets in the two shapes Dockerfiles consume — a raw token
          # (id=gh_token, e.g. Go module url.insteadOf auth) and a ready-made
          # ~/.netrc line (id=netrc, e.g. plain `git clone`/curl over HTTPS).
          # Both derive from ONE source token; a Dockerfile that mounts neither
          # id ignores both (no-op — additive, safe for every sibling repo).
          secrets: |
            gh_token=${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
            netrc=machine github.com login x-access-token password ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  # ── arm64 (native arcd runner — spark matches [self-hosted, linux, arm64]) ──
  build-arm64:
    if: contains(inputs.platforms, 'linux/arm64')
    runs-on: ${{ fromJson(inputs.runner-arm64) }}
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Reset Docker credential store (runner hygiene)
        # Some self-hosted runners carry a leaked Docker Desktop config
        # (credsStore=desktop / docker-credential-desktop.exe) that breaks
        # `docker login` credential storage. Reset to an empty config so the
        # GITHUB_TOKEN auth is stored inline (works on any runner).
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Pre-build command
        if: inputs.pre-build-command != ''
        working-directory: ${{ inputs.context }}
        run: ${{ inputs.pre-build-command }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Tag policy — see build-amd64 metadata step.
          flavor: |
            latest=auto
            suffix=-arm64${{ inputs.tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/arm64
          # SCALE_STANDARD.md §2: GO_EXPERIMENT=jsonv2 by default for
          # all Go builds. Dockerfiles consume via `ARG GO_EXPERIMENT` +
          # `ENV GOEXPERIMENT=${GO_EXPERIMENT}` before `go build`.
          # Non-Go Dockerfiles ignore the unused ARG.
          build-args: |
            GO_EXPERIMENT=${{ inputs.go-experiment }}
            ${{ inputs.build-args }}
          target: ${{ inputs.target || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.image }}-arm64
          cache-to: type=gha,scope=${{ inputs.image }}-arm64,mode=max
          provenance: false
          push: ${{ inputs.push }}
          # Private cross-repo deps (hanzoai/*, luxfi/*): expose the org PAT as
          # BuildKit secrets in the two shapes Dockerfiles consume — a raw token
          # (id=gh_token, e.g. Go module url.insteadOf auth) and a ready-made
          # ~/.netrc line (id=netrc, e.g. plain `git clone`/curl over HTTPS).
          # Both derive from ONE source token; a Dockerfile that mounts neither
          # id ignores both (no-op — additive, safe for every sibling repo).
          secrets: |
            gh_token=${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
            netrc=machine github.com login x-access-token password ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  # ── Multi-platform manifest (both platforms) ─────────────────
  #
  # Composes the merged manifest from the per-arch tags the build jobs
  # pushed, NOT from the build-job digest outputs. Rationale: the
  # spark.local arm64 runner is on WiFi; multi-GB layer pushes succeed
  # but the post-push `cache-to: type=gha` export occasionally drops
  # mid-flight ("tls: bad record MAC", "rpc error: code = Unavailable,
  # closing transport"). buildx then exits non-zero AFTER the image is
  # already in the registry. Gating on `needs.*.result == 'success'`
  # would skip this job even though every per-arch artifact is up.
  #
  # Instead: run with `always()`, verify each per-arch source tag
  # actually exists in the registry, and use `crane index append` to
  # compose the manifest server-side (registry API only — no image
  # rebuild, no Docker daemon required, decouples manifest creation
  # from buildx's cache-export reliability).
  #
  # If a per-arch tag is genuinely missing (real build failure), crane
  # errors and this job fails, which correctly blocks deploy.
  #
  create-manifest:
    if: >-
      always() &&
      inputs.push &&
      contains(inputs.platforms, 'linux/amd64') &&
      contains(inputs.platforms, 'linux/arm64')
    runs-on: ${{ fromJson(inputs.runner-amd64) }}
    needs: [build-amd64, build-arm64]
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      tags: ${{ steps.meta.outputs.json }}
    steps:
      - name: Reset Docker credential store (runner hygiene)
        # Some self-hosted runners carry a leaked Docker Desktop config
        # (credsStore=desktop / docker-credential-desktop.exe) that breaks
        # `docker login` credential storage. Reset to an empty config so the
        # GITHUB_TOKEN auth is stored inline (works on any runner).
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Install crane
        run: |
          set -euo pipefail
          if command -v crane >/dev/null 2>&1; then
            crane version
            exit 0
          fi
          CRANE_VERSION="v0.20.2"
          OS="$(uname -s)"; ARCH="$(uname -m)"
          case "$ARCH" in x86_64) ARCH=x86_64;; aarch64|arm64) ARCH=arm64;; esac
          URL="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_${OS}_${ARCH}.tar.gz"
          curl -fsSL "$URL" | sudo tar xz -C /usr/local/bin crane
          crane version

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Multi-arch manifest tag policy:
          #   v* git tag    → :{{version}} AND :latest (manifest pointing to both arches)
          #   branch push   → :sha-<sha7> (immutable, no floating)
          # :latest tracks the most recent semver release so deploys that pin
          # :latest always advance to a real, released build.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Compose multi-arch manifest from per-arch tags
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.image }}"
          # Each merged manifest tag (e.g. ghcr.io/.../world:sha-abc1234)
          # has deterministic per-arch source tags suffixed -amd64/-arm64.
          # Verify both exist on the registry, then compose with crane.
          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No manifest tags produced by metadata-action; nothing to compose."
            exit 0
          fi
          for TAG_REF in "${TAGS[@]}"; do
            BASE="${TAG_REF%:*}"
            TAG="${TAG_REF##*:}"
            AMD64_SRC="${BASE}:${TAG}-amd64"
            ARM64_SRC="${BASE}:${TAG}-arm64"
            echo "→ Verifying ${AMD64_SRC}"
            crane manifest "${AMD64_SRC}" >/dev/null
            echo "→ Verifying ${ARM64_SRC}"
            crane manifest "${ARM64_SRC}" >/dev/null
            echo "→ Composing ${TAG_REF}"
            crane index append \
              -t "${TAG_REF}" \
              -m "${AMD64_SRC}" \
              -m "${ARM64_SRC}"
          done
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

  # ── Tag single-arch image (when only one platform is built) ──
  #
  # When only amd64 OR arm64 is requested, create-manifest is
  # skipped (it requires both). This job ensures the arch-specific
  # image still gets tagged as :latest / :main / :vX.Y.Z.
  #
  # Uses always() because the non-requested arch job is skipped,
  # and GitHub Actions auto-skips dependents of skipped jobs unless
  # always() is present in the if condition.
  #
  tag-single-arch:
    if: >-
      always() &&
      inputs.push &&
      !(contains(inputs.platforms, 'linux/amd64') && contains(inputs.platforms, 'linux/arm64')) &&
      (needs.build-amd64.result == 'success' || needs.build-arm64.result == 'success') &&
      !(needs.build-amd64.result == 'failure' || needs.build-arm64.result == 'failure') &&
      !(needs.build-amd64.result == 'cancelled' || needs.build-arm64.result == 'cancelled')
    runs-on: ${{ fromJson(inputs.runner-amd64) }}
    needs: [build-amd64, build-arm64]
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Reset Docker credential store (runner hygiene)
        # Some self-hosted runners carry a leaked Docker Desktop config
        # (credsStore=desktop / docker-credential-desktop.exe) that breaks
        # `docker login` credential storage. Reset to an empty config so the
        # GITHUB_TOKEN auth is stored inline (works on any runner).
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Tag policy — see create-manifest metadata step.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Tag single-arch image
        run: |
          IMAGE="${{ inputs.image }}"
          # Use whichever arch digest is available
          AMD64="${{ needs.build-amd64.outputs.digest }}"
          ARM64="${{ needs.build-arm64.outputs.digest }}"
          DIGEST="${AMD64:-$ARM64}"
          echo "Tagging single-arch image ${IMAGE}@${DIGEST}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}@${DIGEST}"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

  # ── Deploy (optional) ────────────────────────────────────────
  #
  # Depends on BOTH create-manifest and tag-single-arch.
  # Exactly one of them will run (multi-arch vs single-arch);
  # the other is skipped. We use always() so a skipped dependency
  # does not auto-skip deploy, then explicitly check that at least
  # one tagging path succeeded and nothing failed or was cancelled.
  #
  deploy:
    if: >-
      always() &&
      (needs.create-manifest.result == 'success' || needs.tag-single-arch.result == 'success') &&
      !(needs.create-manifest.result == 'failure' || needs.tag-single-arch.result == 'failure') &&
      inputs.deploy && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ fromJson(inputs.runner-deploy) }}
    needs: [create-manifest, tag-single-arch]
    environment: production
    steps:
      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Deploy
        env:
          DEPLOYMENT: ${{ inputs.deploy-deployment }}
          CONTAINER: ${{ inputs.deploy-container }}
          NAMESPACE: ${{ inputs.deploy-namespace }}
          IMAGE: ${{ inputs.image }}
          DEPLOY_TAG: ${{ inputs.deploy-tag }}
          TIMEOUT: ${{ inputs.deploy-timeout }}
        run: |
          # Container name defaults to deployment name when not given
          CONTAINER="${CONTAINER:-${DEPLOYMENT}}"

          # Resolve the tag to deploy
          if [ -z "${DEPLOY_TAG}" ]; then
            case "${GITHUB_REF}" in
              refs/tags/v*) DEPLOY_TAG="${GITHUB_REF#refs/tags/v}-amd64" ;;
              refs/tags/*)  DEPLOY_TAG="${GITHUB_REF#refs/tags/}-amd64" ;;
              *)            DEPLOY_TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)-amd64" ;;
            esac
          fi
          TARGET="${IMAGE}:${DEPLOY_TAG}"

          echo "Rolling ${NAMESPACE}/${DEPLOYMENT} (container=${CONTAINER}) → ${TARGET}"
          kubectl -n "${NAMESPACE}" set image "deploy/${DEPLOYMENT}" "${CONTAINER}=${TARGET}"

          # Poll readiness via 'get' only — scoped Roles often lack watch.
          TIMEOUT_SECS="${TIMEOUT%s}"
          ELAPSED=0
          INTERVAL=10
          echo "Waiting up to ${TIMEOUT_SECS}s for rollout to converge..."
          while [ "${ELAPSED}" -lt "${TIMEOUT_SECS}" ]; do
            AVAILABLE=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || echo "Unknown")
            UPDATED=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo "0")
            READY=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            DESIRED=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")
            UNAVAILABLE=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.unavailableReplicas}' 2>/dev/null || echo "")

            echo "[${ELAPSED}s] available=${AVAILABLE} updated=${UPDATED} ready=${READY}/${DESIRED} unavailable=${UNAVAILABLE:-0}"

            if [ "${AVAILABLE}" = "True" ] && [ "${READY}" = "${DESIRED}" ] \
                && [ "${UPDATED}" = "${DESIRED}" ] && [ -z "${UNAVAILABLE}" ]; then
              echo "Deploy complete: ${NAMESPACE}/${DEPLOYMENT} now at ${TARGET}"
              exit 0
            fi

            sleep ${INTERVAL}
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "ERROR: Timed out after ${TIMEOUT_SECS}s waiting for ${NAMESPACE}/${DEPLOYMENT}"
          kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" -o yaml || true
          exit 1

  # ── SBOM (Software Bill of Materials) ────────────────────────
  #
  # Generates SPDX + CycloneDX SBOMs from the just-pushed image and
  # publishes them two ways so OSS revenue-share attribution
  # (hanzoai/commerce contributor payouts) can map a deployed image →
  # its components → contributors:
  #   1. workflow artifact  — always retrievable via the GitHub API
  #   2. OCI artifact attached to the image digest via cosign —
  #      retrievable by digest with `cosign download sbom <ref>`
  #
  # Runs after the manifest/tag jobs (so the image exists in the
  # registry) but is independent of deploy and best-effort: it is NOT
  # in deploy's `needs`, and its publish steps are continue-on-error,
  # so an SBOM hiccup can never block a release.
  #
  sbom:
    # Documented intent: an SBOM hiccup (e.g. transient syft install failure on a
    # self-hosted runner) must NEVER fail a release — deploy does not `need` sbom.
    # continue-on-error makes the job's own failure non-fatal to the run, matching
    # that intent (previously a syft error red-flagged builds whose image published).
    continue-on-error: true
    if: >-
      always() &&
      inputs.push && inputs.sbom &&
      (needs.create-manifest.result == 'success' || needs.tag-single-arch.result == 'success')
    runs-on: ${{ fromJson(inputs.runner-amd64) }}
    needs: [create-manifest, tag-single-arch]
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Reset Docker credential store (runner hygiene)
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Install syft, cosign, crane
        run: |
          set -euo pipefail
          BIN="${HOME}/.local/bin"; mkdir -p "${BIN}"
          # $GITHUB_PATH only affects LATER steps; export for THIS step too so the
          # `command -v` guards + the `syft version` verify below resolve the
          # freshly-installed binaries instead of failing 127 (command not found)
          # on a runner with no preinstalled syft — the SBOM job's real failure mode.
          echo "${BIN}" >> "$GITHUB_PATH"; export PATH="${BIN}:${PATH}"
          if ! command -v syft >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "${BIN}"
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            COSIGN_VER="v2.4.1"
            OS="$(uname -s | tr '[:upper:]' '[:lower:]')"; ARCH="$(uname -m)"
            case "${ARCH}" in x86_64) ARCH=amd64;; aarch64|arm64) ARCH=arm64;; esac
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VER}/cosign-${OS}-${ARCH}" -o "${BIN}/cosign"
            chmod +x "${BIN}/cosign"
          fi
          if ! command -v crane >/dev/null 2>&1; then
            CRANE_VER="v0.20.2"
            OS="$(uname -s)"; ARCH="$(uname -m)"
            case "${ARCH}" in x86_64) ARCH=x86_64;; aarch64|arm64) ARCH=arm64;; esac
            curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VER}/go-containerregistry_${OS}_${ARCH}.tar.gz" | tar xz -C "${BIN}" crane
          fi
          syft version; cosign version; crane version

      - name: Resolve image reference
        id: ref
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Generate SBOM (SPDX + CycloneDX)
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.image }}"
          TAG_REF="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          if [ -z "${TAG_REF}" ] || [ "${TAG_REF}" = "null" ]; then
            echo "No image tag resolved; nothing to SBOM."; exit 0
          fi
          DIGEST="$(crane digest "${TAG_REF}")"
          REF="${IMAGE}@${DIGEST}"
          echo "SBOM target: ${REF}"
          # Pin the digest into the env for downstream steps.
          echo "SBOM_REF=${REF}" >> "$GITHUB_ENV"
          syft "${REF}" -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json
          echo "components: $(jq '.packages | length' sbom.spdx.json 2>/dev/null || echo '?')"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.ref.outputs.json }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: warn

      - name: Attach SBOM to image (best-effort)
        if: env.SBOM_REF != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          cosign attach sbom --sbom sbom.spdx.json --type spdx "${SBOM_REF}"
          echo "Attached SBOM to ${SBOM_REF}"

      # Datastore ingest is NOT a CI concern. CI produces the SBOM and attaches
      # it to the image digest (cosign, above); the registry is the source of
      # truth. The cloud SBOM subsystem — already admin, owns the datastore,
      # knows deployed digests — pulls the attached SBOM from the registry and
      # materializes components. The producer attaches; the consumer pulls. No
      # CI credential, no admin token, no per-repo secret, no env plumbing.
