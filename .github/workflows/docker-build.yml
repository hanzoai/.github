name: Docker Build & Push (Reusable)

# Reusable workflow for native multi-arch Docker builds.
# Native runners only — NO GitHub-hosted runners, period.
#   runner-amd64: hanzo-build-linux-amd64 (DO ARC, max 30)
#   runner-arm64: spark-hanzoai-arm64 (self-hosted on spark.local — native ARM64)
#                 ARC arm64 (hanzo-build-linux-arm64) is paused on DOKS until
#                 DigitalOcean ships arm64 droplets; spark.local fills the gap
#                 with native Ampere/aarch64 hardware. See memory:multiarch_builds.
#   runner-deploy: hanzo-deploy-linux-amd64 (DO ARC, max 20)
#
# Cross-org callers (luxfi/*, zooai/*, partner/*) MUST override these
# with their own org's pool labels — runner pools are NOT visible cross-org.
# Pool labels per org:
#   hanzoai  → runner-amd64: hanzo-build-linux-amd64   runner-arm64: spark-hanzoai-arm64
#   luxfi    → runner-amd64: lux-build-linux-amd64     runner-arm64: spark-luxfi-arm64
#                                                       (or evo-luxfi-amd64 for self-hosted amd64)
#   zooai    → runner-amd64: zoo-build-linux-amd64     runner-arm64: spark-zooai-arm64
#                                                       (or evo-zooai-amd64 for self-hosted amd64)
#
# Self-hosted swarm runners (evo.local / spark.local) registered per-org with
# strict isolation (no cross-org labels — luxfi/* on hanzoai-labels won't
# dispatch, per ARC pool rule). See memory:multiarch_builds and
# /tmp/install-runner.sh on each host.
# GitHub-hosted runners are NOT a permitted fallback.
#
# ─── Registry support ────────────────────────────────────────────────
# registry=ghcr.io  (default) → GITHUB_TOKEN login for hanzoai/luxfi/zooai
# registry=us-docker.pkg.dev   → GCP SA JSON in secrets.GCP_CREDENTIAL for partner
#                               (org secret on partner org; pass secrets: inherit)
#
# ─── Multi-image repos ───────────────────────────────────────────────
# Callers with more than one image fan-out via their own matrix:
#
#   jobs:
#     docker:
#       strategy:
#         matrix:
#           include:
#             - image: ghcr.io/hanzoai/chat-api
#               dockerfile: Dockerfile.api
#             - image: ghcr.io/hanzoai/chat-web
#               dockerfile: Dockerfile.web
#       uses: hanzoai/.github/.github/workflows/docker-build.yml@main
#       with:
#         image: ${{ matrix.image }}
#         dockerfile: ${{ matrix.dockerfile }}
#       secrets: inherit
#
# ─── Pre-build steps ─────────────────────────────────────────────────
# For repos that must compile a binary before the Dockerfile COPYs it
# (e.g. hanzo/dns), pass `pre-build-command` — it runs on each arch
# runner before `docker buildx build`.
#
# Usage — simple single-image GHCR:
#
#   jobs:
#     docker:
#       uses: hanzoai/.github/.github/workflows/docker-build.yml@main
#       with:
#         image: ghcr.io/hanzoai/myservice
#       secrets: inherit

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name (e.g. ghcr.io/hanzoai/bot, us-docker.pkg.dev/liquidity-registry/partner/mpc)"
        required: true
        type: string
      registry:
        description: "Container registry (ghcr.io or us-docker.pkg.dev)"
        default: "ghcr.io"
        type: string
      context:
        description: "Docker build context"
        default: "."
        type: string
      dockerfile:
        description: "Dockerfile path relative to context"
        default: "Dockerfile"
        type: string
      build-args:
        description: "Docker build args (multiline KEY=VALUE). Concatenated with go-experiment for Go builds."
        default: ""
        type: string
      go-experiment:
        description: "GOEXPERIMENT value for Go builds (forwarded as GO_EXPERIMENT build-arg). Default 'jsonv2' per SCALE_STANDARD.md §2 — -12% time / -23% allocs at the JSON edge. Set to '' to opt out."
        default: "jsonv2"
        type: string
      target:
        description: "Docker build target stage"
        default: ""
        type: string
      platforms:
        description: "Comma-separated platforms to build"
        default: "linux/amd64,linux/arm64"
        type: string
      push:
        description: "Push images to registry"
        default: true
        type: boolean
      pre-build-command:
        description: "Shell command to run before docker buildx build (e.g. 'go build -o dns-server ./cmd/dns')"
        default: ""
        type: string
      deploy:
        description: "Deploy after build (kubectl set image to the just-built tag)"
        default: false
        type: boolean
      deploy-deployment:
        description: "K8s deployment name"
        default: ""
        type: string
      deploy-container:
        description: "Container name within the deployment to update (defaults to deploy-deployment)"
        default: ""
        type: string
      deploy-namespace:
        description: "K8s namespace for deployment"
        default: "hanzo"
        type: string
      deploy-tag:
        description: "Explicit image tag to deploy. Defaults to {version}-amd64 on tag pushes (e.g. v1.2.3 → 1.2.3-amd64), sha-<short>-amd64 on branch pushes."
        default: ""
        type: string
      deploy-timeout:
        description: "Rollout readiness timeout"
        default: "300s"
        type: string
      tag-suffix:
        description: "Extra suffix for tags (e.g. -slim)"
        default: ""
        type: string
      cache-key:
        description: "Registry cache key prefix (defaults to image name)"
        default: ""
        type: string
      runner-amd64:
        description: "Runner label for amd64 builds (ARC). Cross-org callers MUST override with their org's pool."
        default: "hanzo-build-linux-amd64"
        type: string
      runner-arm64:
        description: "Runner label for arm64 builds. Default targets self-hosted spark.local (hanzoai org). Cross-org callers MUST override: luxfi→spark-luxfi-arm64, zooai→spark-zooai-arm64."
        default: "spark-hanzoai-arm64"
        type: string
      runner-deploy:
        description: "Runner label for deploy jobs (ARC). Cross-org callers MUST override with their org's pool."
        default: "hanzo-deploy-linux-amd64"
        type: string

    outputs:
      amd64-digest:
        description: "amd64 image digest"
        value: ${{ jobs.build-amd64.outputs.digest }}
      arm64-digest:
        description: "arm64 image digest"
        value: ${{ jobs.build-arm64.outputs.digest }}
      manifest-tags:
        description: "Final manifest tags (JSON)"
        value: ${{ jobs.create-manifest.outputs.tags }}

    # NO explicit `secrets:` block. The previous version declared
    # GCP_CREDENTIAL here on the theory that explicit declarations were
    # required for cross-org `secrets: inherit`. Empirically the opposite
    # is true: every cross-org caller (luxfi/operator, luxfi/devops,
    # luxfi/faucet, luxfi/dex, luxfi/docs, luxfi/market, luxfi/netrunner,
    # luxfi/chat, …) has been emitting `startup_failure` after 0–2s with
    # no jobs dispatched since 2026-04-24. Cause: when a reusable
    # workflow declares a `secrets:` block, GitHub validates the caller's
    # secret visibility against THAT specific list at startup. For
    # cross-org callers without `GCP_CREDENTIAL` defined in their org or
    # repo, the validation fails and the workflow is rejected before
    # any job runs.
    #
    # Omitting the `secrets:` block lets `secrets: inherit` flow every
    # caller-accessible secret transparently. `${{ secrets.GCP_CREDENTIAL }}`
    # below still resolves where the caller has it (partner org
    # secret), and evaluates to empty string elsewhere. The GAR login
    # step already gates on `inputs.registry == 'us-docker.pkg.dev'`,
    # so empty GCP_CREDENTIAL on a ghcr.io push has no effect.

jobs:
  # ── amd64 (ARC runner on hanzo-k8s) ──────────────────────────
  build-amd64:
    if: contains(inputs.platforms, 'linux/amd64')
    runs-on: ${{ inputs.runner-amd64 }}
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Pre-build command
        if: inputs.pre-build-command != ''
        working-directory: ${{ inputs.context }}
        run: ${{ inputs.pre-build-command }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Tag policy:
          #   v* git tag    → :{{version}}-amd64 AND :latest-amd64
          #   branch push   → :sha-<sha7>-amd64 (immutable, no floating)
          #   PR push       → :pr-N-amd64 (ephemeral review)
          # :latest tracks the most recent semver release (never floats off main).
          flavor: |
            latest=auto
            suffix=-amd64${{ inputs.tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          # SCALE_STANDARD.md §2: GO_EXPERIMENT=jsonv2 by default for
          # all Go builds. Dockerfiles consume via `ARG GO_EXPERIMENT` +
          # `ENV GOEXPERIMENT=${GO_EXPERIMENT}` before `go build`.
          # Non-Go Dockerfiles ignore the unused ARG.
          build-args: |
            GO_EXPERIMENT=${{ inputs.go-experiment }}
            ${{ inputs.build-args }}
          target: ${{ inputs.target || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.image }}-amd64
          cache-to: type=gha,scope=${{ inputs.image }}-amd64,mode=max
          provenance: false
          push: ${{ inputs.push }}

  # ── arm64 (native — self-hosted spark.local default, override per org) ───
  build-arm64:
    if: contains(inputs.platforms, 'linux/arm64')
    runs-on: ${{ inputs.runner-arm64 }}
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Pre-build command
        if: inputs.pre-build-command != ''
        working-directory: ${{ inputs.context }}
        run: ${{ inputs.pre-build-command }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Tag policy — see build-amd64 metadata step.
          flavor: |
            latest=auto
            suffix=-arm64${{ inputs.tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/arm64
          # SCALE_STANDARD.md §2: GO_EXPERIMENT=jsonv2 by default for
          # all Go builds. Dockerfiles consume via `ARG GO_EXPERIMENT` +
          # `ENV GOEXPERIMENT=${GO_EXPERIMENT}` before `go build`.
          # Non-Go Dockerfiles ignore the unused ARG.
          build-args: |
            GO_EXPERIMENT=${{ inputs.go-experiment }}
            ${{ inputs.build-args }}
          target: ${{ inputs.target || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.image }}-arm64
          cache-to: type=gha,scope=${{ inputs.image }}-arm64,mode=max
          provenance: false
          push: ${{ inputs.push }}

  # ── Multi-platform manifest (both platforms) ─────────────────
  create-manifest:
    if: inputs.push && contains(inputs.platforms, 'linux/amd64') && contains(inputs.platforms, 'linux/arm64')
    runs-on: ${{ inputs.runner-amd64 }}
    needs: [build-amd64, build-arm64]
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      tags: ${{ steps.meta.outputs.json }}
    steps:
      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Multi-arch manifest tag policy:
          #   v* git tag    → :{{version}} AND :latest (manifest pointing to both arches)
          #   branch push   → :sha-<sha7> (immutable, no floating)
          # :latest tracks the most recent semver release so deploys that pin
          # :latest always advance to a real, released build.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Create and push manifest
        run: |
          IMAGE="${{ inputs.image }}"
          AMD64_DIGEST="${{ needs.build-amd64.outputs.digest }}"
          ARM64_DIGEST="${{ needs.build-arm64.outputs.digest }}"
          echo "Creating manifest for ${IMAGE}"
          echo "  amd64: ${AMD64_DIGEST}"
          echo "  arm64: ${ARM64_DIGEST}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

  # ── Tag single-arch image (when only one platform is built) ──
  #
  # When only amd64 OR arm64 is requested, create-manifest is
  # skipped (it requires both). This job ensures the arch-specific
  # image still gets tagged as :latest / :main / :vX.Y.Z.
  #
  # Uses always() because the non-requested arch job is skipped,
  # and GitHub Actions auto-skips dependents of skipped jobs unless
  # always() is present in the if condition.
  #
  tag-single-arch:
    if: >-
      always() &&
      inputs.push &&
      !(contains(inputs.platforms, 'linux/amd64') && contains(inputs.platforms, 'linux/arm64')) &&
      (needs.build-amd64.result == 'success' || needs.build-arm64.result == 'success') &&
      !(needs.build-amd64.result == 'failure' || needs.build-arm64.result == 'failure') &&
      !(needs.build-amd64.result == 'cancelled' || needs.build-arm64.result == 'cancelled')
    runs-on: ${{ inputs.runner-amd64 }}
    needs: [build-amd64, build-arm64]
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        if: inputs.registry == 'us-docker.pkg.dev'
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIAL }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # Tag policy — see create-manifest metadata step.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Tag single-arch image
        run: |
          IMAGE="${{ inputs.image }}"
          # Use whichever arch digest is available
          AMD64="${{ needs.build-amd64.outputs.digest }}"
          ARM64="${{ needs.build-arm64.outputs.digest }}"
          DIGEST="${AMD64:-$ARM64}"
          echo "Tagging single-arch image ${IMAGE}@${DIGEST}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}@${DIGEST}"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

  # ── Deploy (optional) ────────────────────────────────────────
  #
  # Depends on BOTH create-manifest and tag-single-arch.
  # Exactly one of them will run (multi-arch vs single-arch);
  # the other is skipped. We use always() so a skipped dependency
  # does not auto-skip deploy, then explicitly check that at least
  # one tagging path succeeded and nothing failed or was cancelled.
  #
  deploy:
    if: >-
      always() &&
      (needs.create-manifest.result == 'success' || needs.tag-single-arch.result == 'success') &&
      !(needs.create-manifest.result == 'failure' || needs.tag-single-arch.result == 'failure') &&
      inputs.deploy && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ inputs.runner-deploy }}
    needs: [create-manifest, tag-single-arch]
    environment: production
    steps:
      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Deploy
        env:
          DEPLOYMENT: ${{ inputs.deploy-deployment }}
          CONTAINER: ${{ inputs.deploy-container }}
          NAMESPACE: ${{ inputs.deploy-namespace }}
          IMAGE: ${{ inputs.image }}
          DEPLOY_TAG: ${{ inputs.deploy-tag }}
          TIMEOUT: ${{ inputs.deploy-timeout }}
        run: |
          # Container name defaults to deployment name when not given
          CONTAINER="${CONTAINER:-${DEPLOYMENT}}"

          # Resolve the tag to deploy
          if [ -z "${DEPLOY_TAG}" ]; then
            case "${GITHUB_REF}" in
              refs/tags/v*) DEPLOY_TAG="${GITHUB_REF#refs/tags/v}-amd64" ;;
              refs/tags/*)  DEPLOY_TAG="${GITHUB_REF#refs/tags/}-amd64" ;;
              *)            DEPLOY_TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)-amd64" ;;
            esac
          fi
          TARGET="${IMAGE}:${DEPLOY_TAG}"

          echo "Rolling ${NAMESPACE}/${DEPLOYMENT} (container=${CONTAINER}) → ${TARGET}"
          kubectl -n "${NAMESPACE}" set image "deploy/${DEPLOYMENT}" "${CONTAINER}=${TARGET}"

          # Poll readiness via 'get' only — scoped Roles often lack watch.
          TIMEOUT_SECS="${TIMEOUT%s}"
          ELAPSED=0
          INTERVAL=10
          echo "Waiting up to ${TIMEOUT_SECS}s for rollout to converge..."
          while [ "${ELAPSED}" -lt "${TIMEOUT_SECS}" ]; do
            AVAILABLE=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || echo "Unknown")
            UPDATED=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo "0")
            READY=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            DESIRED=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")
            UNAVAILABLE=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" \
              -o jsonpath='{.status.unavailableReplicas}' 2>/dev/null || echo "")

            echo "[${ELAPSED}s] available=${AVAILABLE} updated=${UPDATED} ready=${READY}/${DESIRED} unavailable=${UNAVAILABLE:-0}"

            if [ "${AVAILABLE}" = "True" ] && [ "${READY}" = "${DESIRED}" ] \
                && [ "${UPDATED}" = "${DESIRED}" ] && [ -z "${UNAVAILABLE}" ]; then
              echo "Deploy complete: ${NAMESPACE}/${DEPLOYMENT} now at ${TARGET}"
              exit 0
            fi

            sleep ${INTERVAL}
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "ERROR: Timed out after ${TIMEOUT_SECS}s waiting for ${NAMESPACE}/${DEPLOYMENT}"
          kubectl -n "${NAMESPACE}" get deploy "${DEPLOYMENT}" -o yaml || true
          exit 1
