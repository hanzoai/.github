# actionlint config — declare our runner labels so `runs-on` references don't
# read as "unknown". RUNNERS.md is the taxonomy's source of truth: the canonical
# label is the compound `<org>-<os>-<arch>`; the purpose labels below are compat
# aliases act_runner still advertises for workflows written before it.
self-hosted-runner:
  labels:
    - amd64
    - hanzo-linux-amd64
    - hanzo-build-linux-amd64
    - hanzo-deploy-linux-amd64
    - lux-build-linux-amd64
    - lux-deploy-linux-amd64
    - zoo-build-linux-amd64
    - hanzobot-build-linux-amd64
